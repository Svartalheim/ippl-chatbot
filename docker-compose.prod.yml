# ==========================================================================
# Profil produksi / staging (CODE-09, CODE-11, CODE-12)
# Pakai bersama file dasar:
#   make certs            # sertifikat TLS self-signed untuk uji (ganti dengan sertifikat resmi di produksi)
#   make up-prod          # = docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Perubahan terhadap profil pengembangan:
# - Hanya proxy (nginx, TLS 1.3) yang dibuka ke host. Postgres, Keycloak, Ollama, backend tidak dipublikasikan.
# - Postgres memakai SSL; backend & Keycloak terhubung dengan sslmode=require (NFR-SEC-009).
# - Backend tanpa --reload, beberapa worker, stateless (NFR-SCL-002), healthcheck + restart (NFR-REL-001).
# - Layanan backup terjadwal (pg_dump + arsip dokumen, rotasi) (NFR-REL-002).
# Membutuhkan Docker Compose v2.24+ (tag !reset / !override).
# ==========================================================================
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./infra/certs:/certs:ro
    # Kunci privat harus milik user postgres dengan izin 0600, jadi disalin dulu dari mount read-only.
    entrypoint:
      - bash
      - -c
      - >
        mkdir -p /etc/pg-certs &&
        cp /certs/server.crt /certs/server.key /etc/pg-certs/ &&
        chown postgres:postgres /etc/pg-certs/server.* &&
        chmod 600 /etc/pg-certs/server.key &&
        exec docker-entrypoint.sh postgres
        -c ssl=on
        -c ssl_cert_file=/etc/pg-certs/server.crt
        -c ssl_key_file=/etc/pg-certs/server.key
        -c ssl_min_protocol_version=TLSv1.2

  keycloak:
    ports: !reset []
    restart: unless-stopped
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak?sslmode=require
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"

  ollama:
    ports: !reset []
    restart: unless-stopped

  backend:
    ports: !reset []
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?ssl=require
      AUDIT_ARCHIVE_DIR: /code/data/audit_archive
      ENABLE_DEBUG_ENDPOINTS: "false"
    # Kode sudah ada di image; tanpa bind mount kode & tanpa --reload
    volumes: !override
      - ./data/documents:/code/data/documents
      - ./data/audit_archive:/code/data/audit_archive
    command:
      - sh
      - -c
      - uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-4} --proxy-headers --forwarded-allow-ips='*'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    ports: !override
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    environment: !reset {}
    volumes: !override
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    depends_on: !override
      backend:
        condition: service_healthy

  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGSSLMODE: require
      BACKUP_DIR: /backups
      DOCUMENTS_DIR: /documents
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
      - ./data/documents:/documents:ro
      - ./scripts/backup-job.sh:/backup-job.sh:ro
    entrypoint: ["bash", "-c", "while true; do bash /backup-job.sh || echo 'backup gagal'; sleep $${BACKUP_INTERVAL_SECONDS}; done"]
    depends_on:
      postgres:
        condition: service_healthy
