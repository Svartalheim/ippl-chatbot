# Reverse proxy TLS untuk profil produksi (docker-compose.prod.yml)
# - TLS 1.3 saja (SKPL 2.4.1)
# - /api/* diteruskan ke backend FastAPI (prefix /api dibuang)
# - Header keamanan dasar

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 25m;   # unggahan dokumen maks 20 MB

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;    # generasi LLM bisa lama
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
